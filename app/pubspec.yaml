name: obroh
description: "Obroh Chronicles — Mobile App"
publish_to: 'none'
version: 1.0.0+1

# Android configuration
android:
  package: com.obroh.chronicles

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  cached_network_image: ^3.4.0
  flutter_secure_storage: ^9.2.0
  intl: ^0.19.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  shimmer: ^3.0.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_staggered_animations: ^1.1.1
  firebase_core: ^4.2.0
  firebase_messaging: ^16.2.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpg"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/logo.jpg"
